<!doctype html>
<meta charset="utf-8">
<title>Testes Zela</title>
<pre id="out"></pre>
<script type="module">
import{parseText,parseDate,detectDateFormat}from'../src/modules/csv.js';
import{buildPeople,getVisitState}from'../src/modules/model.js';

const out=document.querySelector('#out');
let pass=0,fail=0;
const t=(name,fn)=>{
  try{fn();out.textContent+='✅ '+name+'\n';pass++}
  catch(error){out.textContent+='❌ '+name+': '+error.message+'\n';fail++}
};
const ok=(value,message='falhou')=>{if(!value)throw Error(message)};

t('data brasileira DD/MM/AAAA',()=>ok(parseDate('16/09/2026') instanceof Date));
t('data ISO AAAA-MM-DD',()=>ok(parseDate('2026-09-16') instanceof Date));
t('data DD-MM-AAAA',()=>ok(parseDate('16-09-2026') instanceof Date));
t('data inválida não é aceita',()=>ok(parseDate('31/02/2026')===null));
t('identifica formato brasileiro',()=>ok(detectDateFormat(['16/09/2026','01/01/2000'])==='DD/MM/AAAA'));

const sample=[
  'e-SUS - Atenção Primária;;;;;;;;',
  'Microárea;04;;;;;;;',
  'Gerado em ;16/09/2026; às ;21:52;;;;',
  'NOME CIDADÃO;DATA DE NASCIMENTO;LOGRADOURO;DATA DA ÚLTIMA VISITA;PRÓXIMA VISITA',
  'PESSOA TESTE;01/01/2000;RUA A;01/08/2026;20/09/2026'
].join('\n');

t('localiza cabeçalho após preâmbulo',()=>{
  const parsed=parseText(sample);
  ok(parsed.data.length===1);
  ok(parsed.meta.microarea==='04');
  ok(parsed.meta.dateFormat==='DD/MM/AAAA');
});

t('reconhece colunas de visita',()=>{
  const parsed=parseText(sample);
  ok(parsed.data[0].lastVisit==='01/08/2026');
  ok(parsed.data[0].nextVisit==='20/09/2026');
  ok(parsed.meta.hasVisitDate===true);
});

t('marca visita vencida somente com data prevista explícita',()=>{
  const people=buildPeople([{name:'Pessoa A',birth:'01/01/2000',cpf:'-',cns:'-',street:'RUA A',lastVisit:'01/08/2026',nextVisit:'10/09/2026'}]);
  ok(getVisitState(people[0],new Date(2026,8,18)).key==='agora');
});

t('última visita sem próxima data vira histórico, não atraso',()=>{
  const people=buildPeople([{name:'Pessoa B',birth:'01/01/2000',cpf:'-',cns:'-',street:'RUA B',lastVisit:'01/08/2026',nextVisit:''}]);
  ok(getVisitState(people[0],new Date(2026,8,18)).key==='historico');
});

out.textContent+='\n'+pass+' passaram · '+fail+' falharam';
document.body.dataset.result=fail?'fail':'pass';
</script>
