<!doctype html><meta charset="utf-8"><title>Testes Território ACS</title><pre id="out"></pre><script type="module">import{parseText,parseDate}from'../src/modules/csv.js';import{buildPeople,buildAlerts}from'../src/modules/model.js';const out=document.querySelector('#out');let pass=0,fail=0;const t=(n,fn)=>{try{fn();out.textContent+=`✅ ${n}\n`;pass++}catch(e){out.textContent+=`❌ ${n}: ${e.message}\n`;fail++}};const ok=(v,m='falhou')=>{if(!v)throw Error(m)};t('data brasileira DD/MM/AAAA',()=>ok(parseDate('16/09/2026') instanceof Date));t('data ISO',()=>ok(parseDate('2026-09-16') instanceof Date));t('data inválida não é aceita',()=>ok(parseDate('31/02/2026')===null));const s=`TIPO DE LOGRADOURO;LOGRADOURO;NOME CIDADÃO;DATA DE NASCIMENTO;CPF;CNS\nRUA;A;PESSOA TESTE;01/01/2000;123;-`;t('cabeçalho sem preâmbulo',()=>ok(parseText(s).data.length===1));const s2='e-SUS;;;;;;;;\nGerado em;16/09/2026;;;;;;;\nMicroárea;04;;;;;;;\nTIPO DE LOGRADOURO;LOGRADOURO;NOME CIDADÃO;DATA DE NASCIMENTO;CPF;CNS\nRUA;A;PESSOA TESTE;01/01/2000;123;-';t('localiza cabeçalho após preâmbulo',()=>{const x=parseText(s2);ok(x.data.length===1);ok(x.meta.microarea==='04')});t('alerta para identificador ausente',()=>{const p=buildPeople([{name:'X',birth:'01/01/2000',cpf:'-',cns:'-',responsibleName:'X'}]);ok(buildAlerts(p).some(a=>a.category==='cadastro'))});out.textContent+=`\n${pass} passaram · ${fail} falharam`;document.body.dataset.result=fail?'fail':'pass';</script>
